<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Service Worker Registration with Update Checking -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/calcologas/sw.js')
          .then((registration) => {
            console.log('[App] SW registered:', registration.scope);

            // Check for updates immediately
            registration.update();

            // Check for updates periodically when online (every 60 seconds)
            setInterval(() => {
              if (navigator.onLine) {
                console.log('[App] Checking for SW updates...');
                registration.update();
              }
            }, 60000);

            // Handle new SW waiting to activate
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              console.log('[App] New SW found, installing...');

              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New SW ready - prompt user or auto-reload
                  console.log('[App] New version available! Reloading...');
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                  window.location.reload();
                }
              });
            });
          })
          .catch((error) => {
            console.log('[App] SW registration failed:', error);
          });

        // Also reload when SW takes control
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }
  </script>
</body>

</html>
